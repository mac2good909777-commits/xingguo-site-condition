<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>興國橡膠廠空地｜現況雜物分類照片</title>
<meta name="description" content="興國橡膠廠空地 2026/09/14 現場照片與影片，依雜物類別分類，供業主確認清運範圍。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#1c1f23;--ink2:#4a5159;--ink3:#7b838c;--bg:#f7f6f3;--card:#fff;--line:#e2e0da;--accent:#0f4c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1150px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(160deg,#0f4c5c,#0c2f38);color:#fff;padding:34px 0 30px}
header h1{margin:0 0 6px;font-size:clamp(21px,4vw,30px);font-weight:700}
header p{margin:0;color:#cfe3e9;font-size:14px}
.warn{background:#fdf3e9;border-left:4px solid #9a4a12;border-radius:6px;padding:12px 16px;
  margin:22px 0 0;font-size:14px;color:#5c3512}
.warn b{color:#9a4a12}

section{padding:30px 0 10px}
h2{font-size:18px;margin:0 0 14px}
h2::before{content:"";display:inline-block;width:4px;height:17px;background:var(--accent);
  margin-right:9px;vertical-align:-2px;border-radius:2px}

#map{height:420px;border-radius:10px;border:1px solid var(--line);background:#dfe3e0}
.maphint{font-size:13px;color:var(--ink3);margin:8px 0 0}
.maphint button{font-family:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;
  color:var(--ink2);padding:4px 11px;border-radius:999px;cursor:pointer;margin-left:6px}
#coords{display:none;width:100%;margin-top:8px;font-family:ui-monospace,monospace;font-size:12px;
  padding:10px;border:1px solid var(--line);border-radius:6px;min-height:100px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.filters button{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:7px 14px;
  border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.cat{margin-bottom:30px}
.cat h3{font-size:16.5px;margin:0 0 3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.cnt{font-size:12.5px;color:var(--ink3);font-weight:400}
.cat p.d{margin:0 0 13px;font-size:13.5px;color:var(--ink3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  cursor:zoom-in;transition:.15s;position:relative}
figure:hover{box-shadow:0 6px 16px rgba(0,0,0,.09);transform:translateY(-2px)}
figure img,figure video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eceae5}
figure.vid{cursor:pointer}
.vbadge{position:absolute;top:10px;left:10px;background:rgba(12,30,38,.86);color:#fff;font-size:11.5px;
  padding:3px 9px;border-radius:999px;letter-spacing:.04em;z-index:2}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:50px;height:50px;
  border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:2}
.play::after{content:"";border-left:15px solid var(--accent);border-top:9px solid transparent;
  border-bottom:9px solid transparent;margin-left:4px}
figcaption{padding:9px 12px 11px;font-size:13px;color:var(--ink2)}
figcaption .no{color:var(--ink3);font-size:11.5px;display:block}

.lb{position:fixed;inset:0;background:rgba(15,18,20,.95);display:none;z-index:9999;
  align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.on{display:flex}
.lb img,.lb video{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px;background:#000}
.lb .cap{color:#e8e8e6;font-size:13.5px;margin-top:12px;text-align:center;max-width:60ch}
.lb button{position:absolute;background:rgba(255,255,255,.13);color:#fff;border:0;width:46px;height:46px;
  border-radius:50%;font-size:22px;cursor:pointer;line-height:1}
.lb .x{top:16px;right:16px}.lb .pv{left:12px;top:50%;transform:translateY(-50%)}
.lb .nx{right:12px;top:50%;transform:translateY(-50%)}

footer{background:#12222a;color:#9fb3bb;padding:22px 0;font-size:12.5px;margin-top:24px;line-height:1.7}
@media(max-width:600px){#map{height:320px}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>興國橡膠廠空地｜現況雜物分類照片</h1>
    <p>2026/09/14 現場拍攝　｜　照片 24 張・影片 6 段</p>
  </div>
</header>

<div class="wrap">
  <div class="warn">
    <b>⚠ 清運前須先確認：</b>現場鐵桶內容物不明（可能屬事業廢棄物）、板材是否含石棉未經判定 —— 這兩項會影響清運方式與費用。
  </div>
</div>

<section class="wrap">
  <h2>影片拍攝位置</h2>
  <div id="map"></div>
  <p class="maphint">標號 ①–⑥ 對應下方影片，<b>位置為依影像判讀之推定值</b>，可拖曳校正。
    <button onclick="toggleEdit()" id="ebtn">開啟拖曳校正</button></p>
  <textarea id="coords" readonly></textarea>
</section>

<section class="wrap">
  <h2>分類照片</h2>
  <div class="filters" id="filters"></div>
  <div id="gallery"></div>
</section>

<footer>
  <div class="wrap">
    興國橡膠廠空地・現況紀錄 2026/09/14　｜　供業主內部確認使用<br>
    本頁為現況目視拍攝紀錄，未進行採樣檢測，不構成廢棄物種類之法定認定。
  </div>
</footer>

<div class="lb" id="lb">
  <button class="x" onclick="closeLb()">✕</button>
  <button class="pv" onclick="step(-1)">‹</button>
  <button class="nx" onclick="step(1)">›</button>
  <div id="lbbody"></div>
  <div class="cap" id="lbcap"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS = [
 {k:"veg",  n:"雜草・自生林木", color:"#3d7a4e",
  d:"芒草、銀合歡等自生灌木與藤蔓大面積覆蓋，高度多及腰以上，部分區域已無法通行。",
  items:[
   {f:"p01.jpg", t:"通道兩側灌木與藤蔓密布，高度及腰以上"},
   {f:"p02.jpg", t:"果樹下有磚造殘跡與零星雜物，中央為既有混凝土便道"},
   {f:"p06.jpg", t:"空地雜草蔓生，角落可見少量廢板材與鐵桶"},
   {f:"p07.jpg", t:"大面積草生地，遠處為鄰地住宅與廠房"},
   {f:"p08.jpg", t:"草高及腰，右側為既有碎石通道"},
   {f:"p29.jpg", t:"高草帶包圍中央鋪面，遠處為鄰地建物"},
   {f:"p30.jpg", t:"外圍芒草高度及胸，背景為鄰地紅磚廠房"},
   {v:"v01", t:"影片①　北段草生區環景，灌木與藤蔓完全覆蓋"},
   {v:"v04", t:"影片④　由草生地走入中央鋪面，右後方為鄰地廠房"}
  ]},
 {k:"metal", n:"廢鐵・鋼構件", color:"#8a5a2b",
  d:"鏽蝕鋼構樑、鐵製工作台、機台底座、鐵架與大型滾筒，沿中央鋪面邊緣堆置，具廢鐵回收價值。",
  items:[
   {f:"p14.jpg", t:"鋪面全景：左側鐵製工作台與鐵箱，右側成堆鐵料"},
   {f:"p15.jpg", t:"鋪面中央鐵料堆：鏽蝕鐵件、藍色鐵座、黃色槽體"},
   {f:"p16.jpg", t:"同一堆置點另一角度，雜草已侵入鋪面邊緣"},
   {f:"p17.jpg", t:"左側鏽蝕鐵料與藍色鐵座"},
   {f:"p18.jpg", t:"右側長條鏽蝕鋼樑／軌道件沿邊界排列"},
   {f:"p19.jpg", t:"鋪面全景，右側可見鋼樑與零星垃圾"},
   {f:"p20.jpg", t:"鋼構樑、大型圓形滾筒、黃色設備件集中一線"},
   {f:"p21.jpg", t:"長段鏽蝕鋼構樑，背景為鄰地紅磚舊廠房"},
   {f:"p22.jpg", t:"鋼構樑旁散落藍色編織袋等垃圾"},
   {f:"p23.jpg", t:"鋪面全景，右側鐵製工作台，左側散落帆布袋"},
   {v:"v05", t:"影片⑤　鋪面東側：鏽蝕工作台、鐵箱與機械殘件，左後方為紅磚廠房"},
   {v:"v06", t:"影片⑥　鋪面中央環景，兩側鐵料堆，前方為圍籬與公路"}
  ]},
 {k:"drum", n:"桶槽類（內容物待確認）", color:"#b03a2e",
  d:"200 公升鐵桶（藍／綠／紅）與不明槽體，外觀鏽蝕。若含油品或製程殘留物即屬事業廢棄物，須分流處理。",
  items:[
   {f:"p04.jpg", t:"通道旁堆置：藍／綠鐵桶、白色鐵櫃與流理台、木棧板"},
   {f:"p27.jpg", t:"藍色鐵桶與白色浪板、廢木料散落鋪面"},
   {f:"p28.jpg", t:"鐵桶、浪板、木料，右側雜草已逼近鋪面"},
   {v:"v02", t:"影片②　沿通道前行，右側連續堆置鐵桶、帆布與雜物"}
  ]},
 {k:"constr", n:"營建廢料・板材", color:"#a9741f",
  d:"金屬浪板、石綿瓦類板材、水泥板、木棧板與廢木料，部分為早期建物拆除後遺留。",
  items:[
   {f:"p05.jpg", t:"藍色鐵架、廢木料、鏽鐵板與黑色橡膠布堆置通道旁"},
   {f:"p24.jpg", t:"鐵皮浪板、廣告帆布、廢輪胎與木櫃傾倒堆置"},
   {v:"v03", t:"影片③　通道南段：藍色鐵架與板材，左後方為公路旁廣告看板"}
  ]},
 {k:"misc", n:"帆布・輪胎・家具雜物", color:"#4a6fa5",
  d:"廢帆布與大型廣告帆布、塑膠編織袋、廢輪胎、鐵櫃與流理台等，體積大、重量輕。",
  items:[
   {f:"p25.jpg", t:"帆布、浪板、輪胎與藍色鐵桶混雜堆置"},
   {f:"p26.jpg", t:"左側帆布堆、右側鐵桶與雜物，中央鋪面尚屬空曠"}
  ]}
];

/* 影片歸屬之現場定位點（依畫面內容判讀，可拖曳校正） */
const VSPOT = {v01:"A", v02:"B", v03:"B", v04:"C", v05:"D", v06:"D"};
const VNO = {v01:"①",v02:"②",v03:"③",v04:"④",v05:"⑤",v06:"⑥"};
/* 業主標示之現場定位點 A–D */
const SPOTS = {A:[24.12728,120.55936], B:[24.12685,120.55900], C:[24.12675,120.55917], D:[24.12692,120.55922]};
const VTITLE = {};
CATS.forEach(c=>c.items.forEach(i=>{ if(i.v) VTITLE[i.v]=i.t; }));

/* ---------- gallery ---------- */
document.getElementById("filters").innerHTML =
  [{k:"all",n:"全部"}].concat(CATS.map(c=>({k:c.k,n:c.n.replace(/（.*/,"")})))
  .map((b,i)=>`<button data-k="${b.k}" aria-pressed="${i===0}">${b.n}</button>`).join("");

document.getElementById("gallery").innerHTML = CATS.map(c=>`
 <div class="cat" data-k="${c.k}">
  <h3><span class="dot" style="background:${c.color}"></span>${c.n}
    <span class="cnt">照片 ${c.items.filter(i=>i.f).length} 張${c.items.filter(i=>i.v).length?`・影片 ${c.items.filter(i=>i.v).length} 段`:""}</span></h3>
  <p class="d">${c.d}</p>
  <div class="grid">
   ${c.items.map(i=> i.v ? `
    <figure class="vid" data-v="${i.v}">
      <span class="vbadge">影片 ${VNO[i.v]}</span><span class="play"></span>
      <img src="videos/${i.v}.jpg" alt="${i.t}" loading="lazy">
      <figcaption><span class="no">${i.v.toUpperCase()}</span>${i.t}</figcaption>
    </figure>` : `
    <figure data-f="${i.f}">
      <img src="photos/${i.f}" alt="${i.t}" loading="lazy">
      <figcaption><span class="no">${i.f.replace('.jpg','').replace('p','照片 ')}</span>${i.t}</figcaption>
    </figure>`).join("")}
  </div>
 </div>`).join("");

document.getElementById("filters").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  document.querySelectorAll(".cat").forEach(c=> c.hidden = !(b.dataset.k==="all" || c.dataset.k===b.dataset.k));
});

/* ---------- lightbox ---------- */
let idx=0;
const vis=()=>[...document.querySelectorAll(".cat:not([hidden]) figure")];
document.getElementById("gallery").addEventListener("click", e=>{
  const f=e.target.closest("figure"); if(!f) return; idx=vis().indexOf(f); show();
});
function show(){
  const v=vis(); if(!v.length) return; idx=(idx+v.length)%v.length;
  const f=v[idx], body=document.getElementById("lbbody");
  body.innerHTML = f.dataset.v
    ? `<video src="videos/${f.dataset.v}.mp4" poster="videos/${f.dataset.v}.jpg" controls autoplay playsinline></video>`
    : `<img src="photos/${f.dataset.f}" alt="">`;
  document.getElementById("lbcap").textContent = f.querySelector("img").alt;
  document.getElementById("lb").classList.add("on");
}
function step(d){ idx+=d; show(); }
function closeLb(){ document.getElementById("lb").classList.remove("on"); document.getElementById("lbbody").innerHTML=""; }
document.getElementById("lb").addEventListener("click", e=>{ if(e.target.id==="lb") closeLb(); });
document.addEventListener("keydown", e=>{
  if(!document.getElementById("lb").classList.contains("on")) return;
  if(e.key==="Escape") closeLb();
  if(e.key==="ArrowRight") step(1);
  if(e.key==="ArrowLeft") step(-1);
});

/* ---------- map ---------- */
const map = L.map("map").setView([24.12695,120.55919], 18);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:20, attribution:"Imagery © Esri, Maxar, Earthstar Geographics"}).addTo(map);

/* 同一定位點有多支影片時，以小幅偏移錯開 */
const seen={};
const VPOS={};
Object.entries(VSPOT).forEach(([v,s])=>{
  const n = seen[s] = (seen[s]||0);
  seen[s]++;
  const total = Object.values(VSPOT).filter(x=>x===s).length;
  const r = total>1 ? 0.000055 : 0;
  const a = (n/total)*2*Math.PI - Math.PI/2;
  VPOS[v] = [SPOTS[s][0] + r*Math.sin(a)*0.92, SPOTS[s][1] + r*Math.cos(a)];
});

const markers={};
Object.entries(VPOS).forEach(([k,ll])=>{
  const m = L.marker(ll,{draggable:false, title:VTITLE[k],
    icon:L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,15],
      html:`<div style="width:30px;height:30px;border-radius:50%;background:#0f4c5c;color:#fff;
        border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;
        justify-content:center;font:700 15px/1 sans-serif">${VNO[k]}</div>`})}).addTo(map);
  m.bindPopup(`<b>影片 ${VNO[k]}</b><br>${VTITLE[k]}<br><video src="videos/${k}.mp4" poster="videos/${k}.jpg"
     controls playsinline style="width:260px;margin-top:6px;border-radius:4px"></video>`,{maxWidth:280});
  m.on("dragend", dump);
  markers[k]=m;
});

let editing=false;
function toggleEdit(){
  editing=!editing;
  Object.values(markers).forEach(m=> editing ? m.dragging.enable() : m.dragging.disable());
  document.getElementById("ebtn").textContent = editing ? "完成校正" : "開啟拖曳校正";
  document.getElementById("coords").style.display = editing ? "block" : "none";
  if(editing) dump();
}
function dump(){
  document.getElementById("coords").value = Object.entries(markers)
    .map(([k,m])=>{const p=m.getLatLng(); return `${k}: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;}).join("\n");
}
</script>
</body>
</html>
